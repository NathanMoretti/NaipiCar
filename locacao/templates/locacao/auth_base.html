{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}NaipiCar{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'locacao/css/auth.css' %}">
</head>
<body>
    <div class="auth {% block layout %}{% endblock %}">
        <aside class="auth-painel {% block painel_classe %}{% endblock %}" style="--foto: url('{% block foto %}{% endblock %}');">
            <div class="auth-painel-conteudo">
                <div class="auth-pin"><i class="bi bi-geo-alt"></i></div>
                <div>{% block painel %}{% endblock %}</div>
            </div>
        </aside>

        <main class="auth-lado">
            <div class="auth-caixa">
                <a href="{% url 'index' %}" class="auth-logo">
                    <img src="{% static 'img/logo.png' %}" alt="NaipiCar - Seu caminho começa em Foz">
                </a>
                {% if messages %}
                    {% for message in messages %}
                        <div class="auth-alerta {{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
                {% block formulario %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="{% static 'locacao/js/auth.js' %}"></script>
</body>
</html>
