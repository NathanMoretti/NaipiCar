{% extends 'locacao/base.html' %}

{% block titulo %}Entrar - NaipiCar{% endblock %}

{% block conteudo %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4 text-primary">Entrar no NaipiCar</h2>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100 mt-3">Entrar</button>
                    </form>
                    <div class="text-center mt-3">
                        <small class="text-muted">Não tem uma conta? <a href="{% url 'cadastro' %}">Criar Conta</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
